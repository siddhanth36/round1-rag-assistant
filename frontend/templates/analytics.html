{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="page-head">
  <div><h1>Analytics</h1><p>Read-only review of every question asked, and the ones the manuals could not answer.</p></div>
</div>
<div class="stack-lg">
  <section aria-label="Key metrics" id="kpis" aria-busy="true"><div class="skeleton" aria-hidden="true"><span></span></div></section>

  <div class="split">
    <section class="panel" aria-labelledby="ledger-h">
      <div class="panel-head"><h2 id="ledger-h">Outcomes by machine</h2></div>
      <div class="panel-body" id="ledger" aria-busy="true"><div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div></div>
    </section>
    <section class="panel" aria-labelledby="trend-h">
      <div class="panel-head"><h2 id="trend-h">Questions per day</h2><span class="readout">last 7 days</span></div>
      <div class="panel-body" id="trend" aria-busy="true">
        <div class="chart-box"><canvas id="trend-chart" role="img" aria-label="Line chart of questions per day for the last 7 days"></canvas></div>
        <details class="mt-3 small-ui"><summary>Show as table</summary><div id="trend-table"></div></details>
      </div>
    </section>
  </div>

  <section class="panel" aria-labelledby="log-h">
    <div class="panel-head flex-wrap">
      <h2 id="log-h">Question log</h2>
      <form class="filters" id="filters">
        <div>
          <label class="form-label" for="f-status">Outcome</label>
          <select class="form-select form-select-sm" id="f-status" name="status">
            <option value="">All outcomes</option>
            <option value="unanswered">Unanswered</option>
            <option value="answered">Answered</option>
            <option value="insufficient_evidence">Not in the manuals</option>
            <option value="error">Couldn't answer</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="f-machine">Machine</label>
          <select class="form-select form-select-sm" id="f-machine" name="machine"><option value="">All machines</option></select>
        </div>
        <div>
          <label class="form-label" for="f-user">Engineer</label>
          <input class="form-control form-control-sm" id="f-user" name="user" placeholder="username" autocomplete="off">
        </div>
        <div>
          <label class="form-label" for="f-from">From</label>
          <input class="form-control form-control-sm" id="f-from" name="from" type="date">
        </div>
        <div>
          <label class="form-label" for="f-to">To</label>
          <input class="form-control form-control-sm" id="f-to" name="to" type="date">
        </div>
      </form>
    </div>
    <div id="log" aria-busy="true"><div class="panel-body"><div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div></div></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
<script type="module" src="{% static 'js/analytics.js' %}"></script>
{% endblock %}
