{% extends "base.html" %}
{% load static %}
{% block head %}<link rel="stylesheet" href="{% static 'css/inspections.css' %}">{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Inspection <span class="mono">#{{ pk }}</span></h1>
    <p>The model's prediction is stored once and never changes. Supervisor reviews are separate records added beside it.</p>
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="/inspections/"><i class="bi bi-chevron-left" aria-hidden="true"></i> Inspection history</a>
</div>
<div id="detail" data-id="{{ pk }}" aria-busy="true">
  <div class="panel"><div class="panel-body"><div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div></div></div>
</div>
{% endblock %}
