[pytest]
DJANGO_SETTINGS_MODULE = backend.config.settings
python_files = tests.py test_*.py
# Keep the Supabase test database (test_postgres) between runs instead of dropping it: dropping fails while the
# pooler still holds the persistent connection, and recreating a remote DB is slow. New migrations are still
# applied. Use --create-db to rebuild it from scratch. Tests never touch the real database.
addopts = --reuse-db
markers =
    live: calls the real Groq API (skipped when GROQ_API_KEY is not set); deselect with -m "not live"
